defaults:
  - data: capitl_2015_2019
  - model: gru
  - train: default
  - env: auto
  - _self_

seed: 42

hydra:
  run:
    dir: ${oc.env:NYLOAD_OUTPUT_DIR,outputs}/runs/${now:%Y-%m-%d_%H-%M-%S}_${model.name}
  sweep:
    dir: ${oc.env:NYLOAD_OUTPUT_DIR,outputs}/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${model.name}
  job:
    chdir: false
